<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">
			<!--一部修正-->
			<form th:action="@{/attendance/update}" method="post" onsubmit="return confirmUpdate();">
				<div style="max-height:400px; overflow-y:auto;"><!--追加-->
					<table class="table table-hover dataTable no-footer">
						<thead>
							<tr>
								<th class="w140">日付</th>
								<th class="w300">コース内容</th>
								<th class="w80">定時</th><!--追加-->
								<th class="w70">出勤</th>
								<th class="w70">退勤</th>
								<th class="w80">中抜け時間</th>
								<th class="w70">ステータス</th>
								<th class="w240">備考</th>
							</tr>
						</thead>
						<tbody>
							<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
								<!--追加-->
								<tr th:classappend="${dailyAttendanceForm.isToday} == 1 ? 'info'">
									<th:block>
										<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"
											th:value="${dailyAttendanceForm.isToday}" />
										<input type="hidden"
											th:name="|attendanceList[${stat.index}].studentAttendanceId|"
											th:value="${dailyAttendanceForm.studentAttendanceId}" />
										<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"
											th:value="${dailyAttendanceForm.trainingDate}" />
										<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"
											th:value="${dailyAttendanceForm.dispTrainingDate}" />
										<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"
											th:value="${dailyAttendanceForm.sectionName}" />
										<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"
											th:value="${dailyAttendanceForm.statusDispName}" />

									</th:block>
									<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
									<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>
									<!-- Task.28 定時ボタン -->
									<td class="w80">
										<button type="button" class="btn btn-success default-button"
											th:onclick="|setDefaultTime(${stat.index})|">
											定時
										</button>
									</td>
									</td>
									<!--Task26：出勤（時・分） -->
									<td class="w140">
										<table>
											<tr>
												<td>
													<select th:name="|attendanceList[${stat.index}].trainingStartHour|"
														class="form-control">
														<option value="">--</option>
														<option th:each="hour : ${attendanceForm.startHourMap}"
															th:value="${hour.key}"
															th:selected="${hour.key.toString() == dailyAttendanceForm.trainingStartHour}">
															[[${hour.value}]]
														</option>
													</select>
												</td>
												<td>:</td>
												<td>
													<select
														th:name="|attendanceList[${stat.index}].trainingStartMinute|"
														class="form-control">
														<option value="">--</option>
														<option th:each="minute : ${attendanceForm.startMinuteMap}"
															th:value="${minute.key}"
															th:selected="${minute.key.toString() == dailyAttendanceForm.trainingStartMinute}">
															[[${minute.value}]]
														</option>
													</select>
												</td>
											</tr>
										</table>
									</td>
									<!--Task26：退勤（時・分） -->
									<td class="w140">
										<table>
											<tr>
												<td>
													<select th:name="|attendanceList[${stat.index}].trainingEndHour|"
														class="form-control">
														<option value="">--</option>
														<option th:each="hour : ${attendanceForm.endHourMap}"
															th:value="${hour.key}"
															th:selected="${hour.key.toString() == dailyAttendanceForm.trainingEndHour}">
															[[${hour.value}]]
														</option>
													</select>
												</td>
												<td>:</td>
												<td>
													<select th:name="|attendanceList[${stat.index}].trainingEndMinute|"
														class="form-control">
														<option value="">--</option>
														<option th:each="minute : ${attendanceForm.endMinuteMap}"
															th:value="${minute.key}"
															th:selected="${minute.key.toString() == dailyAttendanceForm.trainingEndMinute}">
															[[${minute.value}]]
														</option>
													</select>
												</td>
											</tr>
										</table>
									</td>
									<td class="w80">
										<select th:name="|attendanceList[${stat.index}].blankTime|"
											class="form-control">
											<option th:each="blankTime : ${attendanceForm.blankTimes}"
												th:value="${blankTime.key}" th:inline="text" class="form-control"
												th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
												[[${blankTime.value}]]
											</option>
										</select>
									</td>
									<!--task26ここまで -->
									<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
									<td class="w240">
										<input type="text" th:name="|attendanceList[${stat.index}].note|"
											th:value="${dailyAttendanceForm.note}" class="form-control"></input>
									</td>
								</tr>
							</th:block>
						</tbody>
					</table>
				</div>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" />
				</div>

			</form>
		</div>
	</div>

	<script type="text/javascript">
		// Task.27 更新確認ダイアログ
		function confirmUpdate() {
			return confirm('更新します。よろしいですか？');
		}

		// Task.28 定時ボタン（09:00〜18:00）
		function setDefaultTime(index) {
			var startHour = document.getElementsByName(
				'attendanceList[' + index + '].trainingStartHour')[0];
			var startMinute = document.getElementsByName(
				'attendanceList[' + index + '].trainingStartMinute')[0];
			var endHour = document.getElementsByName(
				'attendanceList[' + index + '].trainingEndHour')[0];
			var endMinute = document.getElementsByName(
				'attendanceList[' + index + '].trainingEndMinute')[0];

			if (startHour && startMinute && endHour && endMinute) {
				startHour.value = '9';
				startMinute.value = '0';
				endHour.value = '18';
				endMinute.value = '0';
			}
		}
	</script>

</body>

</html>
